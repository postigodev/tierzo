[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tierzo"
version = "0.1.0"
description = "Agentic tier-list asset generator core and CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
tierzo = "tierzo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
